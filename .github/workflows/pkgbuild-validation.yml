name: PKGBUILD validation

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'tests/**'
      - 'maintenance/**'
      - '.github/workflows/pkgbuild-validation.yml'
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'tests/**'
      - 'maintenance/**'
      - '.github/workflows/pkgbuild-validation.yml'
  workflow_dispatch:
    inputs:
      base:
        description: 'Diff base revision for changed-package validation'
        required: false
        default: origin/main
      mode:
        description: 'makepkg validation mode'
        type: choice
        required: false
        default: source
        options:
          - metadata
          - source
          - prepare

permissions:
  contents: read

jobs:
  static:
    name: Static PKGBUILD and optimization checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile maintenance tooling
        run: python3 -m py_compile tools/pkgbuild_guard.py tools/pkgbuild_validate.py tests/test_pkgbuild_tools.py
      - name: Test maintenance tooling
        run: python3 -m unittest -v tests/test_pkgbuild_tools.py
      - name: Enforce immutable PGO/BOLT regions
        run: python3 tools/pkgbuild_guard.py check
      - name: Validate all in-scope PKGBUILDs
        run: python3 tools/pkgbuild_validate.py
      - name: Reject whitespace errors
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD^)
          git diff --check "$base"...HEAD

  source-preflight:
    name: Changed package source preflight
    # A source preflight can download multi-gigabyte Chromium, kernel, or Proton
    # trees.  Run it deliberately from workflow_dispatch, or label a PR
    # pkgbuild-source-preflight once its changed-package set is reviewed.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pkgbuild-source-preflight')
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CI helpers
        run: pacman -Syu --noconfirm git python
      - name: Verify changed package sources as an unprivileged builder
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}
          PREFLIGHT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'source' }}
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE' && tools/validate_changed_pkgbuilds.sh --base '$BASE_REF' --mode '$PREFLIGHT_MODE'"
